<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XenoOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="background" aria-hidden="true"></div>
<div id="fpstxt" style="color: black; position: absolute; top: 0px; left: 0px; background-color: white; font-family: Comic Sans MS;">FPS: <span id="fps">0</span></div>

<div id="apps" style="padding-top: 64px; padding-left: 16px;">

<div style="text-align: center; width: fit-content; height: 50px; background-color: none;">
<img src="osimg/notes.png" style="width: 50px; height: 50px; border-radius: 200px; background-color: none;" id="noteicon">
<p style="font-family: Comic Sans MS; font-size: 20px; transform: translateY(-30px);">Notes</p>


  <img src="osimg/hackatime.png" style="width:50px; height:50px;border-radius: 200px; background-color: none; transform: translateY(-50px);" id="staticon">
  <p style="font-family: Comic Sans MS; font-size: 20px; transform: translateY(-80px);">My Stats</p>

  <img src="osimg/settings.png" style="width:50px; height:50px; border-radius: 200px; background-color: none; transform: translateY(-100px);" id="settingicon">
  <p style="font-family: Comic Sans MS; font-size: 20px; transform: translateY(-130px);">Settings</p>

  <img src="webimg/pfp.jpeg">
</div>


</div>

  <div id="noteswindow" style="border: 3px solid rgb(241, 170, 55); width: 500px; height: 400px; color: rgb(255, 255, 255); font-family: Comic Sans MS; padding-left: 10px; background-color: rgb(201, 239, 246); display: none;">
    <button id="closenotes" style="background-color: red; width:30px; height: 30px;"><strong>X</strong></button>
    <h1 style="font-family:Inter !important; font-weight: 100; position: absolute; display: flex; align-self: center; justify-self: center; top: 0px; transform: translateX(210px); color: black;">Notes</h1>
    <textarea  id="notestxt" placeholder="Release your thoughts....." style="width: 480px; height: 320px; transform: translateY(70px);" rows="10" cols="50"></textarea>
    <button id="savebtn" style="background-color: rgb(245, 212, 172); font-family: Comic Sans MS;">Save Notes?</button>
  </div>

 <div id="statwindow" style="position: absolute; bottom: 0; left: 65%; display: none;">
     <img src=" https://github-readme-stats.hackclub.dev/api/wakatime?username=20979&api_domain=hackatime.hackclub.com&theme=rose&custom_title=Hackatime+Stats&layout=compact&cache_seconds=0&langs_count=8" style="z-index: 1;">
      <button id="closestats" style="background-color: red; width:30px; height: 30px; position: fixed; top:8px; right:8px; z-index: 9999;"><strong>X</strong></button>
    </div>

    <div id="settingwindow" style="display:none; background-color: gray; width: 400px; height:300px; position: absolute; transform: translateX(200px);">
      <button id="closesettings" style="background-color:red; width:30px; height:30px;"><strong>X</strong></button>
      <p>Allows you to change the background duration.</p>
      <button id="setting1" style="transform: translateY(0px); font-family: Comic Sans MS; border: 2px black solid; border-radius: 6px; width: 150px; height: 60px;">Change bg duration</button>
    </div>

  <header>
    <div id="clock">
      <div id="day"></div>
      <div id="time"></div>
    </div>
    
  </header>

  <main>
    <div style="top: 500px; border: 5px solid rgb(240, 174, 174); width: fit-content; color: rgb(255, 255, 255); font-family: Comic Sans MS; padding-left: 10px; position: absolute; background-color: black;" id="welcomewindow">
      <button id="closebutton" style="background-color: red;"><strong>X</strong></button>
      <h1>Welcome to XenoOS!</h1>
      <p>FULLSCREEN RECOMMENDED</p>
      <p><big>HEY!</big> <small>I'm Chromix...</small></p>
      <p>save nothing to clear notes</p>
      <p>I'm a big JJK fan as you can tell.</p>
<p>I really like seaweed or any seafood!</p>
<p>I now have a 14 day hackatime streak!</p>
    </div>
  </main>
  <footer>

  </footer>

  <script>
    function updatetime() {
      document.querySelector("#day").textContent =
        new Date().toLocaleDateString("en-US", { weekday: "long" });
      document.getElementById("time").innerHTML = new Date().toLocaleTimeString();
    }
    updatetime();
    setInterval(updatetime, 1000);
  </script>

  <script src="index.js" defer></script>
</body>
</html>
